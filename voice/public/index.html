<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <title>Дом</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <style>
      :root {
        --bg: #0f172a;
        --text: #f8fafc;
        --muted: #94a3b8;
        --idle: #f1f5f9;
        --idle-ink: #0f172a;
        --listening: #22c55e;
        --thinking: #38bdf8;
        --working: #f59e0b;
        --speaking: #6366f1;
        --error: #ef4444;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }
      /* One screen without scrolling: the newest lines of the conversation
         stay at the bottom and older ones fade out at the top. */
      main {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding: max(24px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      .status,
      .hint {
        flex: none;
      }
      .status {
        margin: 0;
        font-size: 34px;
        font-weight: 650;
        min-height: 1.3em;
      }
      .hint {
        margin: 0;
        font-size: 20px;
        color: var(--muted);
        min-height: 1.4em;
      }
      .talk {
        --color: var(--idle);
        position: relative;
        width: min(72vw, 40dvh, 320px);
        flex: none;
        aspect-ratio: 1;
        border: none;
        border-radius: 50%;
        background: var(--color);
        color: var(--idle-ink);
        display: grid;
        place-items: center;
        cursor: pointer;
        box-shadow: 0 12px 40px rgb(0 0 0 / 0.45);
        transition:
          background 0.25s,
          transform 0.15s;
      }
      .talk:active {
        transform: scale(0.97);
      }
      .talk svg {
        width: 38%;
        height: 38%;
      }
      .talk::after {
        content: "";
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        border: 6px solid var(--color);
        opacity: 0;
      }
      [data-state="listening"] .talk {
        --color: var(--listening);
        color: #052e16;
      }
      [data-state="listening"] .talk::after {
        animation: pulse 1.8s ease-out infinite;
      }
      [data-state="thinking"] .talk,
      [data-state="connecting"] .talk {
        --color: var(--thinking);
        color: #082f49;
      }
      [data-state="working"] .talk {
        --color: var(--working);
        color: #451a03;
      }
      [data-state="speaking"] .talk {
        --color: var(--speaking);
        color: #eef2ff;
      }
      [data-state="speaking"] .talk::after,
      [data-state="working"] .talk::after,
      [data-state="connecting"] .talk::after {
        animation: pulse 1.1s ease-out infinite;
      }
      [data-state="error"] .talk {
        --color: var(--error);
        color: #fff;
      }
      @keyframes pulse {
        from {
          opacity: 0.7;
          transform: scale(0.92);
        }
        to {
          opacity: 0;
          transform: scale(1.15);
        }
      }
      .log {
        width: min(100%, 560px);
        flex: 0 1 auto;
        min-height: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        mask-image: linear-gradient(to bottom, transparent 0, #000 32px);
        font-size: 16px;
        color: var(--muted);
        text-align: left;
        overflow-wrap: anywhere;
      }
      .log p {
        margin: 0;
      }
      .log .user {
        color: var(--text);
      }
      @media (prefers-reduced-motion: reduce) {
        [data-state] .talk::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body data-state="idle">
    <main>
      <p id="status" class="status" aria-live="polite">Нажмите и говорите</p>
      <button id="talk" class="talk" type="button" aria-label="Поговорить">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 15a4 4 0 0 0 4-4V6a4 4 0 1 0-8 0v5a4 4 0 0 0 4 4Zm7-4a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.93V20H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.07A7 7 0 0 0 19 11Z"
          />
        </svg>
      </button>
      <p id="hint" class="hint"></p>
      <section id="log" class="log" aria-live="polite"></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
