syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.makesimple.SprutHub.API";
option java_outer_classname = "NotificationClientProto";

package SprutHub.API;

import "SprutHub/API/Utils.proto";
import "SprutHub/API/ExtensionChild.proto";

message NotificationClientRequest {
  oneof kind {
    NotificationClientListRequest list = 1;
    NotificationClientGetRequest get = 2;
    NotificationClientCreateDialogRequest createDialog = 3;
    NotificationClientCreateRequest create = 4;
    NotificationClientDeleteRequest delete = 5;
    NotificationClientGetOptionsRequest getOptions = 6;
    NotificationClientSetOptionsRequest setOptions = 7;
  }
}

message NotificationClientResponse {
  oneof kind {
    NotificationClientsMessage list = 1;
    NotificationClientMessage get = 2;
    OptionsMessage createDialog = 3;
    EmptyResponse create = 4;
    EmptyResponse delete = 5;
    OptionsMessage getOptions = 6;
    EmptyResponse setOptions = 7;
  }
}

message NotificationClientListRequest {
  string extensionKey = 1;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientGetRequest {
  string extensionKey = 1;
  string id = 2;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientCreateDialogRequest {
  string extensionKey = 1;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientCreateRequest {
  string extensionKey = 1;
  repeated OptionUpdateMessage options = 2;

  //Deprecated
  optional string name = 1000 [deprecated = true];
  optional string notificationIndex = 1001 [deprecated = true];
}

message NotificationClientDeleteRequest {
  string extensionKey = 1;
  string id = 2;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientGetOptionsRequest {
  string extensionKey = 1;
  string id = 2;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientSetOptionsRequest {
  string extensionKey = 1;
  string id = 2;
  repeated OptionUpdateMessage options = 3;

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientMessage {
  string extensionKey = 1;
  string id = 2;
  optional string name = 3;
  repeated ExtensionChildButtonType buttons = 4;
  repeated OptionMessage options = 5; // Опции

  optional string notificationIndex = 1000 [deprecated = true];
}

message NotificationClientEvent {
  optional SubscribeType event = 1;
  repeated NotificationClientMessage clients = 2;
}

message NotificationClientsMessage {
  repeated NotificationClientMessage clients = 1;
}
