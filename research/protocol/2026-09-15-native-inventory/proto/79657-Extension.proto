syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.makesimple.SprutHub.API";
option java_outer_classname = "ExtensionProto";

package SprutHub.API;

import "SprutHub/API/Utils.proto";
import "SDK/Utils.proto";

message ExtensionRequest {
  oneof kind {
    ExtensionListRequest list = 1;
    ExtensionGetRequest get = 2;
    ExtensionDeleteRequest delete = 3;
    ExtensionGetOptionsRequest getOptions = 4;
    ExtensionSetOptionsRequest setOptions = 5;

    ExtensionActionRequest action = 9;
  }
}

message ExtensionResponse {
  oneof kind {
    ExtensionsMessage list = 1;
    ExtensionMessage get = 2;
    EmptyResponse delete = 3;
    OptionsMessage getOptions = 4;
    EmptyResponse setOptions = 5;

    EmptyResponse action = 9;
  }
}

message ExtensionEvent {
  SubscribeType event = 1;
  repeated ExtensionMessage extensions = 2;
}

message ExtensionListRequest {
  optional BundleType bundleType = 1;
}

message ExtensionGetRequest {
  string extensionKey = 1;
}

message ExtensionDeleteRequest {
  string extensionKey = 1;
}

message ExtensionGetOptionsRequest {
  string extensionKey = 1;
}

message ExtensionSetOptionsRequest {
  string extensionKey = 1;
  repeated OptionUpdateMessage options = 2;
}

message ExtensionsMessage {
  repeated ExtensionMessage extensions = 1;
}

message ExtensionMessage {
  string extensionKey = 1;
  optional uint32 id = 2;
  optional string type = 3;
  optional string bundleId = 4;
  optional BundleType bundleType = 5;
  optional string index = 6;
  optional string name = 7;
  optional string icon = 8;
  optional bool enabled = 9;
  optional bool discovery = 10;
  optional bool exclusion = 11;
  optional SDK.ReleaseState release = 12;
  optional LoadingState state = 13;
  repeated ExtensionButtonType buttons = 14;
  optional uint32 childCount = 15;
  repeated OptionMessage options = 16; // Опции
  optional string optionsWindow = 17;
  // Рабочее окно расширения: если задано — рисуется на главной, а настройки (optionsWindow)
  // открываются шестерёнкой; если нет — главная, как всегда, optionsWindow
  optional string mainWindow = 18;

  repeated ExtensionSpaceMessage spaces = 100;
  repeated GroupMessage groups = 101;
}

message ExtensionSpaceMessage {
  string key = 1;
  FormLabelMessage label = 2;
  ExtensionSpaceType type = 3;
  repeated ExtensionActionMessage actions = 4;
}

message ExtensionActionMessage {
  uint32 id = 1;
  string icon = 2; // Иконка
  string button = 3; // Название кнопки
  ExtensionActionType type = 4;
  optional uint64 endTimestamp = 5;
  optional bool state = 6;
  optional string windowKey = 7;// Опции
}

message ExtensionActionRequest {
  string extensionKey = 1;
  string spaceKey = 3; // Key пространства, в которой запущен поиск
  uint32 actionId = 4; // ID пространства, в которой запущен поиск
  optional bool state = 5; // Вкл/выкл статус у ACTION_SWITCH, у ACTION_BUTTON и ACTION_ADD_DIALOG передача не требуется
}

enum ExtensionActionType {
  ACTION_BUTTON = 0;
  ACTION_SWITCH = 1;
  ACTION_OPTIONS = 2;
  ACTION_DISCOVERY = 3;
}

enum ExtensionSpaceType {
  SPACE_CHILDREN = 0;
  SPACE_OPTIONS = 1;
  SPACE_OPTIONS_AND_CHILDREN = 2;
}


enum ExtensionButtonType {
  EXT_B_ADD_DIALOG = 0;
  EXT_B_SCAN = 2;
  EXT_B_DISCOVERY_JOIN = 3;
  EXT_B_DISCOVERY_SCAN = 4;


  EXT_B_EXCLUSION = 1000 [deprecated = true];
  EXT_B_NETWORK_MAP = 1001 [deprecated = true];
  EXT_B_DISCOVERY = 1002 [deprecated = true];

  //EXT_B_DISCOVERY_JOIN = 1;
}
