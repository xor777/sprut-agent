  STATUS = 8;
  URL = 9;
  INFO = 10;
  EMAIL = 11;
  HTML = 12;
  IP_ADDR = 13;
  PINCODE = 14;
  QR_CODE = 15;
  LIST = 16;
  PROGRESS_BAR = 17;
  DATE = 18;
  TIME = 19;
  DATETIME = 20;
  PHONE = 21;
  ADDRESS = 22;
  CAPTCHA = 23;
  WINDOW = 24;
  ACCESSORY_LIST = 25;
  CLIPBOARD = 26;
  BUTTON_DANGER = 27;
  LOCATION = 28;
  MARKDOWN = 29;
  SLIDER = 30;
  MESH = 31;
  FILE_UPLOAD = 32;
  FILE_DOWNLOAD = 33;
  EXTENSION = 34;
}

