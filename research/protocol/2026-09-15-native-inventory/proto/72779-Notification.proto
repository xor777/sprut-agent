syntax = "proto3";

option java_multiple_files = true;
option java_package = "org.makesimple.SprutHub.API";
option java_outer_classname = "NotificationProto";

package SprutHub.API;

import "SprutHub/API/Extension.proto";
import "SprutHub/API/Utils.proto";

message NotificationRequest {
  oneof kind {
    NotificationListRequest list = 1;
    NotificationGetRequest get = 2;
    NotificationUpdateRequest update = 3;
    NotificationDeleteRequest delete = 5;
    NotificationGetOptionsRequest getOptions = 7;
    NotificationSetOptionsRequest setOptions = 8;

    NotificationCreateRequest create = 1000 [deprecated = true];
    NotificationTypesRequest types = 1001 [deprecated = true];
  }
}

message NotificationResponse {
  oneof kind {
    NotificationsMessage list = 1;
    ExtensionMessage get = 2;
    EmptyResponse update = 3;
    EmptyResponse delete = 5;
    OptionsMessage getOptions = 7;
    EmptyResponse setOptions = 8;

    ExtensionMessage create = 1000 [deprecated = true];
    NotificationTypesMessage types = 1001 [deprecated = true];
  }
}

message NotificationListRequest {
}

message NotificationGetRequest {
  optional string index = 1;
}

message NotificationCreateRequest {
  string bundleId = 1;

  optional string type = 1000 [deprecated = true];
  optional string name = 1001 [deprecated = true];
}

message NotificationDeleteRequest {
  optional string index = 1;
}

message NotificationUpdateRequest {
  optional string index = 1;
  optional string name = 2;
  optional bool enabled = 3;
}

message NotificationTypesRequest {}

message NotificationGetOptionsRequest {
  optional string index = 1;
}

message NotificationSetOptionsRequest {
  optional string index = 1;
  repeated OptionUpdateMessage options = 2;
}

message NotificationEvent {
  optional SubscribeType event = 1;
  repeated ExtensionMessage notifications = 2;
}

message NotificationsMessage {
  repeated ExtensionMessage notifications = 1;
}

message NotificationTypesMessage {
  repeated string types = 1;
}
